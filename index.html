<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Devre Arkadaşlarımız - CİK Haritası</title>
    <meta name="description" content="Türkiye genelindeki ceza infaz kurumlarında görev yapan devre arkadaşlarımızın listesi ve haritası.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            /* Dark Liquid Glass (Koyu Tema) */
            --bg-canvas: #090a0f;
            --bg-mesh-1: rgba(10, 132, 255, 0.11);
            --bg-mesh-2: rgba(94, 92, 230, 0.08);
            --bg-mesh-3: rgba(48, 209, 88, 0.05);

            --glass-surface: rgba(30, 32, 40, 0.62);
            --glass-surface-hover: rgba(42, 45, 56, 0.72);
            --glass-elevated: rgba(38, 40, 50, 0.78);
            --glass-well: rgba(18, 19, 24, 0.58);
            --glass-pill-active: rgba(255, 255, 255, 0.15);

            --glass-border: rgba(255, 255, 255, 0.09);
            --glass-border-strong: rgba(255, 255, 255, 0.16);
            --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.25);
            --glass-card-shadow: 0 2px 10px rgba(0, 0, 0, 0.22), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);

            --accent: #0A84FF;
            --accent-soft: rgba(10, 132, 255, 0.14);
            --accent-border: rgba(10, 132, 255, 0.32);

            --km-surface: rgba(48, 38, 24, 0.62);
            --km-surface-hover: rgba(58, 46, 28, 0.74);
            --km-border: rgba(255, 179, 64, 0.24);
            --km-badge-bg: rgba(255, 179, 64, 0.15);
            --km-badge-text: #ffb340;
            --km-badge-border: rgba(255, 179, 64, 0.28);

            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-muted: #6e6e73;

            --avatar-bg: rgba(255, 255, 255, 0.07);
            --avatar-text: #e5e5ea;
            --city-tag-bg: rgba(255, 255, 255, 0.07);
            --city-tag-text: #d1d1d6;

            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 13px;
            --radius-pill: 999px;
            --spring: all 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        }

        /* ===== APPLE LIQUID GLASS: LIGHT THEME ===== */
        body.light-theme {
            --bg-canvas: #f2f3f7;
            --bg-mesh-1: rgba(0, 122, 255, 0.07);
            --bg-mesh-2: rgba(175, 82, 222, 0.05);
            --bg-mesh-3: rgba(52, 199, 89, 0.05);

            --glass-surface: rgba(255, 255, 255, 0.66);
            --glass-surface-hover: rgba(255, 255, 255, 0.84);
            --glass-elevated: rgba(255, 255, 255, 0.82);
            --glass-well: rgba(118, 118, 128, 0.11);
            --glass-pill-active: rgba(255, 255, 255, 0.96);

            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-border-strong: rgba(255, 255, 255, 0.85);
            --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 10px 32px -8px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.03);
            --glass-card-shadow: 0 2px 8px rgba(15, 23, 42, 0.035), inset 0 1px 0 0 rgba(255, 255, 255, 0.85);

            --accent: #007AFF;
            --accent-soft: rgba(0, 122, 255, 0.10);
            --accent-border: rgba(0, 122, 255, 0.22);

            --km-surface: rgba(255, 250, 240, 0.78);
            --km-surface-hover: rgba(255, 248, 232, 0.92);
            --km-border: rgba(196, 132, 18, 0.22);
            --km-badge-bg: rgba(196, 132, 18, 0.11);
            --km-badge-text: #946000;
            --km-badge-border: rgba(196, 132, 18, 0.24);

            --text-primary: #1d1d1f;
            --text-secondary: #515154;
            --text-muted: #86868b;

            --avatar-bg: rgba(0, 122, 255, 0.08);
            --avatar-text: #0066cc;
            --city-tag-bg: rgba(118, 118, 128, 0.09);
            --city-tag-text: #48484a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-canvas);
            background-image:
                radial-gradient(at 15% 10%, var(--bg-mesh-1) 0px, transparent 55%),
                radial-gradient(at 85% 18%, var(--bg-mesh-2) 0px, transparent 50%),
                radial-gradient(at 50% 90%, var(--bg-mesh-3) 0px, transparent 55%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.011em;
            transition: background-color 0.35s ease, color 0.25s ease;
        }

        /* ===== HEADER (Liquid Bar) ===== */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--glass-surface);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border-bottom: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 60px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(180deg, #2e90ff 0%, #0066eb 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 102, 235, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.022em;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 11.5px !important;
            color: var(--text-muted) !important;
            font-weight: 400 !important;
            letter-spacing: -0.006em;
            margin-top: 1px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge {
            background: var(--glass-well);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            padding: 5px 11px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        .stat-badge span {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ===== THEME TOGGLE BUTTON ===== */
        #theme-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 0.5px solid var(--glass-border);
            background: var(--glass-well);
            box-shadow: var(--glass-specular);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--spring);
            flex-shrink: 0;
        }

        #theme-toggle:hover {
            background: var(--glass-surface-hover);
            color: var(--text-primary);
            transform: scale(1.04);
        }

        #theme-toggle:active {
            transform: scale(0.95);
        }

        /* ===== APPLE SEGMENTED NAVIGATION BAR ===== */
        #navigation-bar {
            position: fixed;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 600px;
            z-index: 1000;
            background: var(--glass-well);
            backdrop-filter: blur(36px) saturate(190%);
            -webkit-backdrop-filter: blur(36px) saturate(190%);
            border: 0.5px solid var(--glass-border);
            border-radius: var(--radius-pill);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px -4px rgba(0, 0, 0, 0.06);
        }

        .nav-button {
            flex: 1;
            padding: 8px 10px;
            border: 0.5px solid transparent;
            border-radius: var(--radius-pill);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: -0.012em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--spring);
            white-space: nowrap;
        }

        .nav-button i {
            font-size: 12px;
            opacity: 0.78;
            transition: var(--spring);
        }

        .nav-button:hover {
            color: var(--text-primary);
        }

        .nav-button.active {
            background: var(--glass-pill-active);
            color: var(--text-primary);
            font-weight: 600;
            border-color: var(--glass-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 0.5px 1px rgba(0, 0, 0, 0.05), var(--glass-specular);
        }

        .nav-button.active i {
            color: var(--accent);
            opacity: 1;
        }

        /* ===== MAIN CONTENT AREAS ===== */
        .content-section {
            position: absolute;
            top: 122px;
            bottom: 0;
            left: 0;
            right: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateY(4px);
            transition: opacity 0.26s ease, transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
            overflow: hidden;
        }

        .content-section.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* ===== SEARCH BAR (Spotlight Capsule) ===== */
        .search-wrapper {
            padding: 12px 16px 10px;
            max-width: 632px;
            margin: 0 auto;
            position: relative;
        }

        .search-input-box {
            width: 100%;
            padding: 11px 16px 11px 38px;
            background: var(--glass-surface);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-card-shadow);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            letter-spacing: -0.011em;
            outline: none;
            transition: var(--spring);
        }

        .search-input-box::placeholder {
            color: var(--text-muted);
        }

        .search-input-box:focus {
            background: var(--glass-surface-hover);
            border-color: var(--accent-border);
            box-shadow: 0 0 0 3.5px var(--accent-soft), var(--glass-specular);
        }

        .search-wrapper i {
            position: absolute;
            left: 29px;
            top: 50%;
            transform: translateY(-45%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        /* ===== ALPHABETICAL LIST SECTION ===== */
        .list-container {
            position: absolute;
            top: 64px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
            padding: 2px 16px 32px;
            -webkit-overflow-scrolling: touch;
        }

        .list-container::-webkit-scrollbar {
            width: 6px;
        }
        .list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: rgba(142, 142, 147, 0.25);
            border-radius: 999px;
        }

        .list-scroll-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        /* Alphabet index styling (iOS Contacts style) */
        .alphabet-divider {
            position: sticky;
            top: 2px;
            z-index: 5;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--glass-elevated);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-specular);
            border-radius: 8px;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }

        /* Kurum Müdürü Özel Kart Tasarımı (Refined Champagne Glass) */
        .person-card.kurum-muduru {
            background: var(--km-surface);
            border-color: var(--km-border);
        }

        .person-card.kurum-muduru:hover {
            background: var(--km-surface-hover);
            border-color: var(--km-badge-border);
        }

        .person-card.kurum-muduru .person-avatar {
            background: linear-gradient(180deg, #e09132 0%, #b86b11 100%);
            color: #ffffff;
            border: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 2px 6px rgba(184, 107, 17, 0.22);
        }

        .unvan-badge {
            background: var(--km-badge-bg);
            color: var(--km-badge-text);
            border: 0.5px solid var(--km-badge-border);
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            margin-left: 7px;
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            letter-spacing: -0.01em;
        }
        
        /* Harita Popup Kurum Müdürü Tasarımı */
        .popup-person.kurum-muduru {
            background: var(--km-surface);
            border-radius: 10px;
            padding: 7px 9px;
            margin: 3px 0;
            border: 0.5px solid var(--km-border);
        }
        
        /* Haritada Kurum Müdürü olan şehirlere özel marker-pin */
        .marker-pin.km {
            background: linear-gradient(180deg, #e09132 0%, #b86b11 100%) !important;
            box-shadow: 0 4px 12px rgba(184, 107, 17, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
        }

        .person-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            background: var(--glass-surface);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-card-shadow);
            border-radius: var(--radius-lg);
            transition: var(--spring);
        }

        .person-card:hover {
            background: var(--glass-surface-hover);
            transform: translateY(-1px);
            box-shadow: var(--glass-shadow), var(--glass-specular);
        }

        .person-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--avatar-bg);
            border: 0.5px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--avatar-text);
            flex-shrink: 0;
            letter-spacing: -0.02em;
        }

        .person-info {
            flex: 1;
            min-width: 0;
        }

        .person-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.015em;
            line-height: 1.3;
        }

        .person-detail {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.008em;
        }

        .person-city-tag {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 500;
            background: var(--city-tag-bg);
            color: var(--city-tag-text);
            flex-shrink: 0;
            letter-spacing: -0.01em;
        }

        /* ===== CITY GROUP SECTION ===== */
        .city-group-card {
            background: var(--glass-surface);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-card-shadow);
            border-radius: var(--radius-lg);
            margin-bottom: 6px;
            overflow: hidden;
            transition: var(--spring);
        }

        .city-group-header {
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: var(--spring);
        }

        .city-group-header:hover {
            background: var(--glass-surface-hover);
        }

        .city-title-wrapper {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .city-title {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.016em;
        }

        .city-badge {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 11.5px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }

        .city-group-header i.fa-chevron-down {
            font-size: 11px;
            color: var(--text-muted);
            transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), color 0.2s ease;
        }

        .city-group-card.open i.fa-chevron-down {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .city-group-content {
            display: none;
            padding: 6px 12px 12px;
            border-top: 0.5px solid var(--glass-border);
            flex-direction: column;
            gap: 6px;
            background: var(--glass-well);
        }

        .city-group-card.open .city-group-content {
            display: flex;
        }

        /* ===== MAP SECTION ===== */
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* OpenStreetMap Tiles Dark Mode & Transitions */
        .leaflet-tile-pane {
            transition: filter 0.3s ease;
        }

        body:not(.light-theme) .leaflet-tile-pane {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        body:not(.light-theme) .leaflet-container {
            background: #090a0f !important;
        }

        .leaflet-control-attribution {
            background: var(--glass-surface) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            color: var(--text-muted) !important;
            border-radius: 8px 0 0 0 !important;
            border-top: 0.5px solid var(--glass-border) !important;
            border-left: 0.5px solid var(--glass-border) !important;
            padding: 2px 8px !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: var(--accent) !important;
            text-decoration: none !important;
        }

        /* Custom marker (Apple Maps Pill Pin) */
        .custom-marker {
            background: none;
            border: none;
        }

        .marker-pin {
            width: 34px;
            height: 34px;
            border-radius: 50% 50% 50% 4px;
            background: linear-gradient(180deg, #2e90ff 0%, #0066eb 100%);
            position: relative;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 102, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.92);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .marker-pin:hover {
            transform: rotate(-45deg) scale(1.08);
        }

        .marker-pin .marker-count {
            transform: rotate(45deg);
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .marker-pin.multi {
            background: linear-gradient(180deg, #5e5ce6 0%, #3634a3 100%);
            box-shadow: 0 4px 12px rgba(54, 52, 163, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .marker-pin.large {
            width: 40px;
            height: 40px;
            background: linear-gradient(180deg, #007aff 0%, #0040dd 100%);
            box-shadow: 0 5px 14px rgba(0, 64, 221, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        /* MarkerCluster Apple Glass Overrides */
        .marker-cluster-small,
        .marker-cluster-medium,
        .marker-cluster-large {
            background-color: rgba(0, 122, 255, 0.18) !important;
            backdrop-filter: blur(8px);
        }
        .marker-cluster-small div,
        .marker-cluster-medium div,
        .marker-cluster-large div {
            background: linear-gradient(180deg, #2e90ff 0%, #0066eb 100%) !important;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important;
            font-weight: 600 !important;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 3px 10px rgba(0, 102, 235, 0.3);
        }

        /* Leaflet popup overrides (Liquid Glass Sheet) */
        .leaflet-popup-content-wrapper {
            background: var(--glass-elevated) !important;
            backdrop-filter: blur(36px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(36px) saturate(190%) !important;
            border: 0.5px solid var(--glass-border) !important;
            border-radius: var(--radius-xl) !important;
            box-shadow: var(--glass-shadow), var(--glass-specular) !important;
            color: var(--text-primary) !important;
            padding: 0 !important;
        }

        .leaflet-popup-tip {

        }

        .leaflet-popup-close-button {
            color: var(--text-muted) !important;
            top: 12px !important;
            right: 12px !important;
            width: 24px !important;
            height: 24px !important;
            border-radius: 50% !important;
            background: var(--glass-well) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 15px !important;
            line-height: 1 !important;
        }

        .popup-content {
            padding: 15px 16px;
            min-width: 240px;
            max-width: 280px;
            max-height: 310px;
            overflow-y: auto;
        }

        .popup-city {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .popup-city i {
            color: var(--accent);
            font-size: 13px;
        }

        .popup-kurum {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 0.5px solid var(--glass-border);
        }

        .popup-person {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }

        .popup-person + .popup-person {
            border-top: 0.5px solid var(--glass-border);
        }

        .popup-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--avatar-bg);
            border: 0.5px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--avatar-text);
            flex-shrink: 0;
        }

        .popup-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.012em;
        }

        .popup-kurum-name {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

            border: none !important;
            box-shadow: var(--glass-shadow) !important;
            border-radius: 12px !important;

            margin-left: 16px !important;
            margin-bottom: 20px !important;
        }

        .leaflet-control-zoom a {
            background: var(--glass-elevated) !important;

            transition: var(--spring) !important;
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            font-size: 16px !important;

        .leaflet-control-zoom a:hover {
            background: var(--glass-surface-hover) !important;
            color: var(--accent) !important;
        }

        /* ===== LOADING ===== */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-canvas);

            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.35s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        .loading-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

            text-align: center;
            padding: 48px 20px;

            font-size: 13.5px;

            margin-bottom: 10px;

    devreler.forEach(d => {

        if (coord) {
            d.lat = coord[0];
            d.lng = coord[1];

    // ===================================================================
    // HELPER FUNCTIONS
    // ===================================================================
    function normalizeText(text) {
        return text.toLowerCase()
            .replace(/[İı]/g, 'i')
            .replace(/ğ/g, 'g')
            .replace(/ü/g, 'u')
            .replace(/ş/g, 's')
            .replace(/ö/g, 'o')
            .replace(/ç/g, 'c');
    }

    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    }

    // Grouping helper
    function groupByCity(data) {
        const groups = {};
        data.forEach(d => {
            if (!groups[d.sehir]) groups[d.sehir] = [];
            groups[d.sehir].push(d);
        });
        return groups;
    }

    // ===================================================================
    // RENDER: ALPHABETICAL NAME LIST (İsim & Soyisim)
    // ===================================================================
    function renderNameList(searchTerm = '') {
        const container = document.getElementById('name-list-content');
        
        let filtered = devreler.filter(d => {
            const term = normalizeText(searchTerm);
            return normalizeText(d.ad).includes(term) || normalizeText(d.kurum).includes(term) || normalizeText(d.sehir).includes(term);
        });

        // Sort alphabetically by Name
        filtered.sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-search"></i>
                    <p>Aradığınız kriterde devre arkadaşı bulunamadı.</p>
                </div>
            `;
            return;
        }

        let html = '';
        let currentLetter = '';

        filtered.forEach(person => {
            const firstLetter = person.ad.trim().charAt(0).toUpperCase();
            
            // Add alphabetical divider
            if (firstLetter !== currentLetter) {
                currentLetter = firstLetter;
                html += `<div class="alphabet-divider">${currentLetter}</div>`;
            }

            const initials = getInitials(person.ad);
            const isKM = person.unvan === "Kurum Müdürü";
            const cardClass = isKM ? 'person-card kurum-muduru' : 'person-card';
            const unvanHtml = isKM ? '<span class="unvan-badge">Kurum Müdürü</span>' : '';

            html += `
                <div class="${cardClass}">
                    <div class="person-avatar">${initials}</div>
                    <div class="person-info">
                        <div class="person-name">${person.ad}${unvanHtml}</div>
                        <div class="person-detail">${person.kurum}</div>
                    </div>
                    <div class="person-city-tag">${person.sehir}</div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // ===================================================================
    // RENDER: CITY GROUPS (Şehirler)
    // ===================================================================
    function renderCityList(searchTerm = '') {
        const container = document.getElementById('city-list-content');
        
        let filtered = devreler.filter(d => {
            const term = normalizeText(searchTerm);
            return normalizeText(d.ad).includes(term) || normalizeText(d.kurum).includes(term) || normalizeText(d.sehir).includes(term);
        });

        const groups = groupByCity(filtered);
        const sortedCities = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'tr'));

        if (sortedCities.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-search"></i>
                    <p>Aradığınız kriterde şehir veya devre arkadaşı bulunamadı.</p>
                </div>
            `;
            return;
        }

        let html = '';
        sortedCities.forEach(sehir => {
            const kisiler = groups[sehir];
            kisiler.sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));

            html += `
                <div class="city-group-card" id="city-card-${normalizeText(sehir)}">
                    <div class="city-group-header" onclick="toggleCityGroup('${normalizeText(sehir)}')">
                        <div class="city-title-wrapper">
                            <span class="city-title">${sehir}</span>
                            <span class="city-badge">${kisiler.length}</span>
                        </div>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="city-group-content">
            `;

            kisiler.forEach(p => {
                const initials = getInitials(p.ad);
                const isKM = p.unvan === "Kurum Müdürü";
                const cardClass = isKM ? 'person-card kurum-muduru' : 'person-card';
                const unvanHtml = isKM ? '<span class="unvan-badge">Kurum Müdürü</span>' : '';

                html += `
                    <div class="${cardClass}">
                        <div class="person-avatar">${initials}</div>
                        <div class="person-info">
                            <div class="person-name">${p.ad}${unvanHtml}</div>
                            <div class="person-detail">${p.kurum}</div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // ===================================================================
    // RENDER: KURUM MÜDÜRLERİ LİSTESİ (Kurum Müdürleri)
    // ===================================================================
    function renderMudurList(searchTerm = '') {
        const container = document.getElementById('mudur-list-content');
        
        let filtered = devreler.filter(d => d.unvan === "Kurum Müdürü");
        
        if (searchTerm) {
            const term = normalizeText(searchTerm);
            filtered = filtered.filter(d => {
                return normalizeText(d.ad).includes(term) || normalizeText(d.kurum).includes(term) || normalizeText(d.sehir).includes(term);
            });
        }

        // Sort alphabetically by Name
        filtered.sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-search"></i>
                    <p>Aradığınız kriterde kurum müdürü bulunamadı.</p>
                </div>
            `;
            return;
        }

        let html = '';
        let currentLetter = '';

        filtered.forEach(person => {
            const firstLetter = person.ad.trim().charAt(0).toUpperCase();
            
            // Add alphabetical divider
            if (firstLetter !== currentLetter) {
                currentLetter = firstLetter;
                html += `<div class="alphabet-divider">${currentLetter}</div>`;
            }

            const initials = getInitials(person.ad);
            const cardClass = 'person-card kurum-muduru';
            const unvanHtml = '<span class="unvan-badge">Kurum Müdürü</span>';

            html += `
                <div class="${cardClass}">
                    <div class="person-avatar">${initials}</div>
                    <div class="person-info">
                        <div class="person-name">${person.ad}${unvanHtml}</div>
                        <div class="person-detail">${person.kurum}</div>
                    </div>
                    <div class="person-city-tag">${person.sehir}</div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // Accordion Toggle
    window.toggleCityGroup = function(cityId) {
        const card = document.getElementById(`city-card-${cityId}`);
        if (card) {
            card.classList.toggle('open');
        }
    };

    // ===================================================================
    // MAP SETUP & RENDER (Harita)
    // ===================================================================
    let map = null;
    let markerCluster = null;

    function initMap() {
        if (map) return; // Already initialized

        map = L.map('map', {
            center: [39.0, 35.5],
            zoom: 6,
            minZoom: 5,
            maxZoom: 15,
            zoomControl: false,
            attributionControl: true
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // OpenStreetMap tile katmanı (API anahtarı gerektirmez)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
            subdomains: 'abc',
            maxZoom: 19
        }).addTo(map);

        markerCluster = L.markerClusterGroup({
            maxClusterRadius: 40,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            iconCreateFunction: function(cluster) {
                const count = cluster.getChildCount();
                let size = 'small';
                let dim = 40;
                if (count >= 10) { size = 'large'; dim = 50; }
                else if (count >= 5) { size = 'medium'; dim = 45; }
                return L.divIcon({
                    html: '<div><span>' + count + '</span></div>',
                    className: 'marker-cluster marker-cluster-' + size,
                    iconSize: L.point(dim, dim)
                });
            }
        });

        // Group by City
        const cityGroups = groupByCity(devreler);

        Object.entries(cityGroups).forEach(([sehir, kisiler]) => {
            const coord = ilKoordinatlari[sehir];
            if (!coord) return;

            const count = kisiler.length;
            const hasKM = kisiler.some(p => p.unvan === "Kurum Müdürü");
            let markerClass = count >= 5 ? 'large' : (count >= 2 ? 'multi' : '');
            if (hasKM) {
                markerClass += ' km';
            }

            const marker = L.marker(coord, {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: `<div class="marker-pin ${markerClass}"><span class="marker-count">${count}</span></div>`,
                    iconSize: [markerClass.includes('large') ? 42 : 36, markerClass.includes('large') ? 42 : 36],
                    iconAnchor: [markerClass.includes('large') ? 21 : 18, markerClass.includes('large') ? 42 : 36],
                    popupAnchor: [0, -(markerClass.includes('large') ? 42 : 36)]
                })
            });

            let popupHtml = `
                <div class="popup-content">
                    <div class="popup-city"><i class="fas fa-map-marker-alt"></i>${sehir}</div>
                    <div class="popup-kurum">${count} devre arkadaşı</div>
            `;

            kisiler.forEach(p => {
                const pi = getInitials(p.ad);
                const isKM = p.unvan === "Kurum Müdürü";
                const popupPersonClass = isKM ? 'popup-person kurum-muduru' : 'popup-person';
                const unvanHtml = isKM ? '<span class="unvan-badge" style="font-size: 9px; padding: 1.5px 6px; margin-left: 5px; line-height: 1.1;">Kurum Müdürü</span>' : '';
                const avatarStyle = isKM ? 'background: linear-gradient(180deg, #e09132 0%, #b86b11 100%); color: #ffffff; border: none;' : '';

                popupHtml += `
                    <div class="${popupPersonClass}">
                        <div class="popup-avatar" style="${avatarStyle}">${pi}</div>
                        <div>
                            <div class="popup-name">${p.ad}${unvanHtml}</div>
                            <div class="popup-kurum-name">${p.kurum}</div>
                        </div>
                    </div>
                `;
            });

            popupHtml += '</div>';
            marker.bindPopup(popupHtml, { maxWidth: 300, closeButton: true });
            markerCluster.addLayer(marker);
        });

        map.addLayer(markerCluster);

        // Fit Turkey bounds
        const turkeyBounds = L.latLngBounds(
            L.latLng(35.8, 25.5),
            L.latLng(42.2, 44.8)
        );
        map.fitBounds(turkeyBounds, { padding: [10, 10] });
    }

    // ===================================================================
    // TABS & EVENT LISTENERS
    // ===================================================================

    // Helper: Belirli bir sekmeyi aktif et
    function activateTab(targetId) {
        document.querySelectorAll('.nav-button').forEach(b => {
            b.classList.toggle('active', b.dataset.target === targetId);
        });
        document.querySelectorAll('.content-section').forEach(section => {
            section.classList.remove('active');
        });
        const activeSection = document.getElementById(targetId);
        if (activeSection) activeSection.classList.add('active');

        if (targetId === 'mode-harita') {
            setTimeout(() => {
                initMap();
                if (map) map.invalidateSize();
            }, 100);
        }
    }

    document.querySelectorAll('.nav-button').forEach(btn => {
        btn.addEventListener('click', () => {
            activateTab(btn.dataset.target);
        });
    });

    // Anasayfa linki: Devre Arkadaşlarımız başlığına tıklanınca ilk sekmeye dön
    document.getElementById('home-link').addEventListener('click', () => {
        // Arama kutularını temizle
        document.getElementById('search-isim').value = '';
        document.getElementById('search-sehir').value = '';
        document.getElementById('search-mudur').value = '';
        renderNameList();
        renderCityList();
        renderMudurList();
        activateTab('mode-isim');
    });

    // Tema geçişi
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = themeToggleBtn.querySelector('i');
    let isLightTheme = true;

    themeToggleBtn.addEventListener('click', () => {
        isLightTheme = !isLightTheme;
        document.body.classList.toggle('light-theme', isLightTheme);
        themeIcon.className = isLightTheme ? 'fas fa-sun' : 'fas fa-moon';
        themeToggleBtn.title = isLightTheme ? 'Koyu Temaya Geç' : 'Açık Temaya Geç';
    });

    // Search events
    document.getElementById('search-isim').addEventListener('input', (e) => {
        renderNameList(e.target.value);
    });

    document.getElementById('search-sehir').addEventListener('input', (e) => {
        renderCityList(e.target.value);
    });

    document.getElementById('search-mudur').addEventListener('input', (e) => {
        renderMudurList(e.target.value);
    });

    // Initial load
    window.addEventListener('load', () => {
        // Dinamik devre sayacı güncellemesi
        const totalBadge = document.getElementById('stat-total');
        if (totalBadge) {
            totalBadge.innerText = devreler.length;
        }

        renderNameList();
        renderCityList();
        renderMudurList();
        
        // Hide loading
        setTimeout(() => {
            document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);
    });
    </script>
